name: Amplitude Event Validation

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL'
        required: false
        default: 'https://qa.commonsense.org'

jobs:
  amplitude:
    name: Tier 1 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Pre-flight checks
        run: |
          URL="${{ inputs.base_url }}"
          echo "── Target URL ────────────────────────────────────"
          status=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$URL" || echo "000")
          if [[ "$status" =~ ^(2|3)[0-9]{2}$ ]]; then
            echo "✓ $URL is reachable (HTTP $status)"
          else
            echo "::warning::$URL returned HTTP $status — tests may fail"
          fi

          echo "── Spec file check ───────────────────────────────"
          if [ ! -f "cypress/e2e/amplitude_tier1.cy.js" ]; then
            echo "::error::cypress/e2e/amplitude_tier1.cy.js not found"
            exit 1
          fi
          echo "✓ amplitude_tier1.cy.js present"

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install

      - name: Run Amplitude tests
        run: npx cypress run --browser chrome --spec "cypress/e2e/amplitude_tier1.cy.js"
        env:
          CYPRESS_BASE_URL: ${{ inputs.base_url }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amplitude-results-${{ github.run_number }}
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 7
          if-no-files-found: ignore
